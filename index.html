const pad = (n, l = 2) => String(n).padStart(l, "0");

const fcache = new Map();
function fget(key, opts) {
  if (!fcache.has(key)) fcache.set(key, new Intl.DateTimeFormat("en-US", opts));

function getTimeParts(tz, date, hour12) {
  const key = "t|" + (tz || "") + "|" + hour12;

  if (!hour12) opts.hourCycle = "h23";

  const p = {};
  for (const x of fget(key, opts).formatToParts(date)) p[x.type] = x.value;
  return { h: p.hour, m: p.minute, s: p.second, ap: (p.dayPeriod || "").toUpperCase() };

    if (tz) opts.timeZone = tz;
    const p = {};
    for (const x of fget("off|" + (tz || ""), opts).formatToParts(date)) p[x.type] = x.value;
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);

    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [map]);
}

/* ================================================================
   AUDIO (WebAudio-generated tones — no files, no network)
   ================================================================ */
const AudioEngine = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch (e) {} }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  beep(freq = 880, dur = 0.14, when = 0, type = "sine", gain = 0.16) {
    const ctx = this.ensure(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t0 = ctx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  tone(name) {
    const P = {
      chime:   [[659.3, 0], [830.6, 0.18], [987.8, 0.36], [1318.5, 0.54]],
      beep:    [[880, 0], [880, 0.22], [880, 0.44]],
      bell:    [[1318.5, 0], [987.8, 0.16], [659.3, 0.34]],
      digital: [[1244.5, 0], [1244.5, 0.1], [1661.2, 0.2], [1661.2, 0.3]],
    };
    (P[name] || P.beep).forEach(([f, t]) => this.beep(f, 0.16, t, name === "beep" ? "square" : "sine", 0.16));
  },
};

async function requestNotify() {
  if (!("Notification" in window)) return "unsupported";
  if (Notification.permission === "granted") return "granted";
  if (Notification.permission === "denied") return "denied";
  try { return await Notification.requestPermission(); } catch (e) { return "denied"; }
}
function sendNotify(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body, tag: "darkclock-pro" }); } catch (e) {}
  }
}

/* ---- flip clock ---- */
function FlipDigit({ ch }) {
  const [shown, setShown] = useState(ch);
  const [flipping, setFlipping] = useState(false);
  useEffect(() => {
    if (ch !== shown) {
      setFlipping(true);
      const t = setTimeout(() => { setShown(ch); setFlipping(false); }, 450);
      return () => clearTimeout(t);
    }
  }, [ch, shown]);
  return (
    <span className="flip" aria-hidden="true">
      <span className="flip-old num">{shown}</span>
      {flipping && <span key={ch} className="flip-new num">{ch}</span>}
      <span className="sr-only">{ch}</span>
    </span>
  );
}

function FlipClockView({ h, m, s, showSeconds, size }) {

  );
}

    try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
    const onFs = () => { if (!document.fullscreenElement) onClose(); };
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("fullscreenchange", onFs);
    window.addEventListener("keydown", onKey);
    return () => {
      document.body.classList.remove("locked");
      document.removeEventListener("fullscreenchange", onFs);
      window.removeEventListener("keydown", onKey);
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}

  }, []);
  return (

const PRESETS = [1, 5, 10, 15, 25, 30, 60];
function TimerCard({ t, selected, onSelect }) {
  const { tapi, push } = useCtx();
  const [editing, setEditing] = useState(false);
  const [name, setName] = useState(t.name);
  const [confirm, setConfirm] = useState(false);
  const now = useNow(250);
  const rem = t.running ? Math.max(0, t.endAt - now.getTime()) : (t.completed ? 0 : t.remainingMs);
  const prog = t.durationMs > 0 ? (t.completed ? 0 : rem / t.durationMs) : 0;

  const saveName = () => { tapi.rename(t.id, name.trim() || "Timer"); setEditing(false); };
  const toggle = () => {
    if (t.completed) { tapi.reset(t.id); tapi.start(t.id); }
    else if (t.running) tapi.pause(t.id);
    else tapi.start(t.id);
  };

  return (
    <article className={"panel p-5 flex flex-col gap-4 cursor-default" + (selected ? " sel-ring" : "")}
      onClick={onSelect}>
      <div className="flex items-center gap-2 w-full">
        {editing ? (
          <input className="inp text-sm" value={name} autoFocus onChange={e => setName(e.target.value)}
            onBlur={saveName} onKeyDown={e => { if (e.key === "Enter") saveName(); }}
            aria-label="Timer name" onClick={e => e.stopPropagation()} />
        ) : (
          <button className="font-medium text-sm truncate flex items-center gap-2 hover:text-acc transition-colors"
            onClick={e => { e.stopPropagation(); setName(t.name); setEditing(true); }} aria-label={"Rename " + t.name}>
            {t.name}<Icon name="pencil" size={13} className="text-mut" />
          </button>
        )}
        <button className="icon-btn ml-auto shrink-0" style={{ width: 30, height: 30 }}
          aria-label={"Delete " + t.name}
          onClick={e => {
            e.stopPropagation();
            if (confirm) { tapi.remove(t.id); push("Timer deleted"); }
            else { setConfirm(true); setTimeout(() => setConfirm(false), 2500); }
          }}>
          <Icon name={confirm ? "check" : "trash"} size={15} className={confirm ? "text-danger" : ""} />
        </button>
      </div>

      <div className="flex justify-center py-1">
        <ProgressRing progress={prog} size={186}>
          {t.completed ? (
            <div className="text-center px-4">
              <div className="text-acc text-sm font-semibold">Time's up</div>
              <div className="text-xs text-mut mt-1">{t.name}</div>
            </div>
          ) : (
            <div className="text-center">
              <div className="num text-[2rem] font-semibold leading-none">{fmtDur(rem)}</div>
              <div className="text-[10px] uppercase tracking-[.15em] text-mut mt-2">of {fmtDur(t.durationMs)}</div>
            </div>
          )}
        </ProgressRing>
      </div>

      <div className="flex justify-center gap-2 flex-wrap">
        {t.completed ? (
          <React.Fragment>
            <button className="btn btn-primary" onClick={e => { e.stopPropagation(); tapi.reset(t.id); tapi.start(t.id); }}>
              <Icon name="play" size={14} /> Restart
            </button>
            <button className="btn" onClick={e => { e.stopPropagation(); tapi.reset(t.id); }}>Set new timer</button>
            {!t.silenced && (
              <button className="btn" onClick={e => { e.stopPropagation(); tapi.silence(t.id); }} aria-label="Stop the sound">
                <Icon name="volume" size={14} /> Silence
              </button>
            )}
          </React.Fragment>
        ) : (
          <React.Fragment>
            <button className="btn btn-primary min-w-[104px]" onClick={e => { e.stopPropagation(); toggle(); }}>
              <Icon name={t.running ? "pause" : "play"} size={14} />
              {t.running ? "Pause" : rem < t.durationMs ? "Resume" : "Start"}
            </button>
            <button className="btn" disabled={!t.running && rem === t.durationMs && !t.completed}
              onClick={e => { e.stopPropagation(); tapi.reset(t.id); }}>
              <Icon name="reset" size={14} /> Reset
            </button>
          </React.Fragment>
        )}
      </div>
    </article>
  );
}

function TimerPage() {
  const { settings, timers, tapi, push } = useCtx();
  const [h, setH] = useState(0);
  const [m, setM] = useState(settings.defaultTimerMin || 5);
  const [s, setS] = useState(0);
  const [label, setLabel] = useState("");
  const [err, setErr] = useState(false);
  const [selected, setSelected] = useState(null);
  const nameRef = useRef(null);
  const [perm, setPerm] = useState(() => "Notification" in window ? Notification.permission : "unsupported");

  const sel = timers.find(t => t.id === selected) || timers[0];
  const shortcuts = useMemo(() => ({
    Space: () => { if (!sel) return; if (sel.completed) { tapi.reset(sel.id); tapi.start(sel.id); } else if (sel.running) tapi.pause(sel.id); else tapi.start(sel.id); },
    KeyR: () => { if (sel) { tapi.reset(sel.id); push("Timer reset"); } },
    KeyN: () => { if (nameRef.current) { nameRef.current.scrollIntoView({ block: "center", behavior: "smooth" }); nameRef.current.focus(); } },
  }), [sel && sel.id, sel && sel.running, sel && sel.completed]);
  useShortcuts(shortcuts);

  const add = () => {
    const ms = ((+h) * 3600 + (+m) * 60 + (+s)) * 1000;
    if (!ms) { setErr(true); return; }
    setErr(false);
    const id = tapi.add(label.trim(), ms);
    if (id) { setSelected(id); setLabel(""); push("Timer added"); }
  };
  const clamp = (v, max) => { const n = parseInt(v, 10); return isNaN(n) ? 0 : Math.min(max, Math.max(0, n)); };

  return (
    <div className="lg:grid lg:grid-cols-[minmax(0,1fr)_300px] lg:gap-8">
      <div>
        <PageHead icon="timer" title="FREE ONLINE TIMER"
          desc={["Countdown timer with ring, sound and notifications",
            "Set hours, minutes and seconds — or tap a preset. Run multiple labeled timers at once; they keep counting accurately even when you switch tabs."]} />

        {perm === "default" && (
          <div className="panel p-4 mb-5 flex flex-wrap items-center gap-3">
            <span className="text-acc"><Icon name="alarm" size={16} /></span>
            <p className="text-xs text-mut flex-1 min-w-[200px]">Get a desktop notification when a timer finishes — useful while you work in another tab.</p>
            <button className="btn text-xs" onClick={() => requestNotify().then(p => { setPerm(p); if (p === "granted") push("Notifications enabled"); })}>
              Enable notifications
            </button>
          </div>
        )}
        {perm === "denied" && (
          <p className="text-xs text-mut mb-4 flex items-center gap-2"><Icon name="info" size={14} /> Notifications are blocked in your browser settings — the in-page alarm sound still works.</p>
        )}

        {/* composer */}
        <div className="panel p-5">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 className="text-sm font-semibold flex items-center gap-2"><Icon name="plus" size={15} /> New timer</h2>
            <span className="text-xs text-mut">Default {settings.defaultTimerMin} min — change it in Settings</span>
          </div>
          <div className="flex flex-wrap gap-3 items-end">
            {[["Hours", h, setH, 23], ["Minutes", m, setM, 59], ["Seconds", s, setS, 59]].map(([lab, val, set, max]) => (
              <label key={lab} className="block w-[72px]">
                <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">{lab}</span>
                <input type="number" min="0" max={max} className="inp num text-center" value={val}
                  onChange={e => set(clamp(e.target.value, max))} aria-label={lab} />
              </label>
            ))}
            <label className="block flex-1 min-w-[160px]">
              <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Label (optional)</span>
              <input className="inp" placeholder="e.g. Focus block" value={label} onChange={e => setLabel(e.target.value)}
                ref={nameRef} onKeyDown={e => { if (e.key === "Enter") add(); }} aria-label="Timer label" />
            </label>
            <button className="btn btn-primary" onClick={add}><Icon name="plus" size={15} /> Add timer</button>
          </div>
          {err && <p className="text-xs mt-3" style={{ color: "var(--danger)" }}>Set a duration greater than zero.</p>}
          <div className="mt-4 flex flex-wrap gap-2">
            {PRESETS.map(min => (
              <button key={min} className="chip" onClick={() => { setH(0); setM(min); setS(0); setErr(false); }}>
                {min} min
              </button>
            ))}
          </div>
        </div>

        {/* timer cards */}
        {timers.length === 0 ? (
          <div className="panel p-10 mt-5 text-center">
            <div className="text-mut flex justify-center mb-3"><Icon name="timer" size={26} /></div>
            <p className="text-sm font-medium">No timers yet</p>
            <p className="text-xs text-mut mt-1">Pick a duration above — or tap a preset like 25 min for a focus block.</p>
          </div>
        ) : (
          <div className="mt-5 grid sm:grid-cols-2 gap-4" style={{ maxWidth: timers.length === 1 ? 420 : undefined, margin: timers.length === 1 ? "20px auto 0" : undefined }}>
            {timers.map(t => (
              <TimerCard key={t.id} t={t} selected={sel && sel.id === t.id} onSelect={() => setSelected(t.id)} />
            ))}
          </div>
        )}
      </div>
      <aside className="hidden lg:block">
        <div className="sticky top-24">
          <MiniShortcuts items={[["Space", "Start / pause"], ["R", "Reset selected"], ["N", "New timer"]]} />
        </div>
      </aside>
    </div>
  );
}

/* ================================================================
   STOPWATCH PAGE
   ================================================================ */
function StopwatchPage() {
  const { push } = useCtx();
  const [sw, setSw] = usePersisted("stopwatch", { running: false, startAt: null, acc: 0, laps: [] });
  const [, tick] = useReducer(x => x + 1, 0);
  const running = sw.running;

  useEffect(() => {
    if (!running) return;
    let raf;
    const loop = () => { tick(); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    const onVis = () => tick();
    document.addEventListener("visibilitychange", onVis);
    return () => { cancelAnimationFrame(raf); document.removeEventListener("visibilitychange", onVis); };
  }, [running]);

  const elapsed = sw.acc + (sw.running && sw.startAt ? Date.now() - sw.startAt : 0);
  const start = () => { AudioEngine.ensure(); setSw(s => ({ ...s, running: true, startAt: Date.now() })); };
  const pause = () => setSw(s => ({ ...s, running: false, acc: s.acc + (s.startAt ? Date.now() - s.startAt : 0), startAt: null }));
  const reset = () => setSw({ running: false, startAt: null, acc: 0, laps: [] });
  const lap = () => {
    setSw(s => ({ ...s, laps: [...(s.laps || []), s.acc + (s.startAt ? Date.now() - s.startAt : 0)] }));
    AudioEngine.beep(660, 0.06, 0, "square", 0.07);
  };
  const shortcuts = useMemo(() => ({
    Space: () => running ? pause() : start(),
    KeyL: () => { if (running) lap(); },
    KeyR: () => reset(),
  }), [running]);
  useShortcuts(shortcuts);

  const laps = sw.laps || [];
  const deltas = laps.map((t, i) => t - (i ? laps[i - 1] : 0));
  const fastest = deltas.length > 1 ? deltas.indexOf(Math.min(...deltas)) : -1;
  const slowest = deltas.length > 1 ? deltas.indexOf(Math.max(...deltas)) : -1;

  return (
    <div className="lg:grid lg:grid-cols-[minmax(0,1fr)_300px] lg:gap-8">
      <div>
        <PageHead icon="stopwatch" title="STOPWATCH ONLINE"
          desc={["Precision stopwatch with lap splits",
            "Millisecond display, unlimited laps, and automatic highlighting of your fastest and slowest splits. The clock keeps perfect time even if you switch tabs."]} />

        <div className="panel py-14 sm:py-20 px-4 text-center">
          <div className="num font-semibold leading-none tracking-tight text-[clamp(2.8rem,10vw,7rem)]" role="timer" aria-live="off" aria-label={fmtSW(elapsed)}>
            {fmtSW(elapsed)}
          </div>
          <div className="mt-10 flex flex-wrap justify-center gap-3">
            <button className="btn btn-primary min-w-[120px]" onClick={running ? pause : start} disabled={false}>
              <Icon name={running ? "pause" : "play"} size={15} />
              {running ? "Pause" : elapsed > 0 ? "Resume" : "Start"}
            </button>
            <button className="btn min-w-[100px]" onClick={lap} disabled={!running}><Icon name="flag" size={14} /> Lap</button>
            <button className="btn min-w-[100px]" onClick={reset} disabled={elapsed === 0 && !laps.length}>
              <Icon name="reset" size={14} /> Reset
            </button>
          </div>
        </div>

        <div className="panel mt-6 overflow-hidden">
          <div className="px-5 py-4 flex items-center justify-between border-b border-line">
            <h2 className="text-sm font-semibold flex items-center gap-2"><Icon name="flag" size={15} /> Laps <span className="text-mut font-normal num">({laps.length})</span></h2>
            {laps.length > 0 && <button className="btn text-xs" onClick={() => { setSw(s => ({ ...s, laps: [] })); push("Laps cleared"); }}>Clear all laps</button>}
          </div>
          {laps.length === 0 ? (
            <p className="px-5 py-10 text-center text-sm text-mut">
              No laps yet — press <kbd className="kbd">L</kbd> or tap Lap while the stopwatch is running.
            </p>
          ) : (
            <table className="w-full text-sm">
              <thead>
                <tr className="text-left text-[10px] uppercase tracking-[.14em] text-mut border-b border-line">
                  <th scope="col" className="px-5 py-3 font-medium">Lap</th>
                  <th scope="col" className="px-5 py-3 font-medium">Split</th>
                  <th scope="col" className="px-5 py-3 font-medium">Total</th>
                  <th scope="col" className="px-5 py-3 font-medium sr-only">Note</th>
                </tr>
              </thead>
              <tbody className="num">
                {laps.map((t, i) => {
                  const idx = laps.length - 1 - i;
                  const d = deltas[idx];
                  return (
                    <tr key={idx} className="border-b border-line last:border-0">
                      <td className="px-5 py-3">{idx + 1}</td>
                      <td className={"px-5 py-3 font-medium" + (idx === fastest ? " text-acc" : "")}>{fmtSW(d)}
                        {idx === fastest && <span className="ml-2 align-middle inline-flex items-center gap-1 text-[10px] uppercase tracking-wider text-acc"><Icon name="zap" size={11} /> Fastest</span>}
                        {idx === slowest && <span className="ml-2 text-[10px] uppercase tracking-wider text-mut">Slowest</span>}
                      </td>
                      <td className="px-5 py-3 text-mut">{fmtSW(t)}</td>
                      <td className="px-5 py-3 sr-only">{idx === fastest ? "Fastest lap" : idx === slowest ? "Slowest lap" : ""}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      </div>
      <aside className="hidden lg:block">
        <div className="sticky top-24">
          <MiniShortcuts items={[["Space", "Start / pause"], ["L", "Record lap"], ["R", "Reset"]]} />
        </div>
      </aside>
    </div>
  );
}

/* ================================================================
   ALARM PAGE
   ================================================================ */
const TONES = ["chime", "beep", "bell", "digital"];
const DAY_CHIPS = [["S", 0], ["M", 1], ["T", 2], ["W", 3], ["T", 4], ["F", 5], ["S", 6]];

function AlarmPage() {
  const { settings, alarms, aapi, push } = useCtx();
  const now = useNow(1000);
  const [name, setName] = useState("");
  const [time, setTime] = useState("07:30");
  const [days, setDays] = useState([]);
  const [tone, setTone] = useState("chime");
  const [editingId, setEditingId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const [perm, setPerm] = useState(() => "Notification" in window ? Notification.permission : "unsupported");

  const resetForm = () => { setName(""); setTime("07:30"); setDays([]); setTone("chime"); setEditingId(null); };
  const submit = () => {
    if (editingId) {
      aapi.update(editingId, { name: name.trim() || "Alarm", time, days, tone });
      push("Alarm updated");
    } else {
      aapi.add({ name: name.trim() || "Alarm", time, days, tone });
      push("Alarm set for " + fmtStoredTime(time, settings.timeFormat === "12"));
      if (perm === "default") requestNotify().then(p => { setPerm(p); if (p === "granted") push("Notifications enabled for alarms"); });
    }
    resetForm();
  };
  const startEdit = (a) => {
    setEditingId(a.id); setName(a.name); setTime(a.time); setDays([...(a.days || [])]); setTone(a.tone || "chime");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div>
      <PageHead icon="alarm" title="ONLINE ALARM CLOCK"
        desc={["Alarms that ring right in your browser",
          "Set one-time or repeating alarms with custom names and tones. They work even in a background tab — just keep this site open."]} />

      {perm === "denied" && (
        <p className="text-xs text-mut mb-4 flex items-center gap-2">
          <Icon name="belloff" size={14} /> Notifications are blocked — alarms will still ring inside this tab.
        </p>
      )}

      {/* composer */}
      <div className="panel p-5">
        <h2 className="text-sm font-semibold mb-4 flex items-center gap-2">
          <Icon name={editingId ? "pencil" : "plus"} size={15} /> {editingId ? "Edit alarm" : "New alarm"}
        </h2>
        <div className="flex flex-wrap gap-3 items-end">
          <label className="block flex-1 min-w-[150px]">
            <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Name</span>
            <input className="inp" placeholder="e.g. Wake up" value={name} onChange={e => setName(e.target.value)} aria-label="Alarm name" />
          </label>
          <label className="block">
            <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Time</span>
            <input type="time" className="inp num" value={time} onChange={e => setTime(e.target.value)} aria-label="Alarm time" />
          </label>
          <label className="block">
            <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Tone</span>
            <span className="flex gap-2">
              <select className="sel" value={tone} onChange={e => setTone(e.target.value)} aria-label="Alarm tone">
                {TONES.map(t => <option key={t} value={t}>{t[0].toUpperCase() + t.slice(1)}</option>)}
              </select>
              <button className="btn" onClick={() => AudioEngine.tone(tone)} aria-label="Preview tone"><Icon name="volume" size={15} /></button>
            </span>
          </label>
        </div>
        <div className="mt-4 flex flex-wrap items-center gap-3">
          <span className="text-[10px] uppercase tracking-[.14em] text-mut">Repeat</span>
          <div className="flex gap-1.5">
            {DAY_CHIPS.map(([lab, idx], i) => (
              <button key={i} className={"chip w-9 justify-center" + (days.includes(idx) ? " chip-on" : "")}
                aria-pressed={days.includes(idx)} aria-label={["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][idx]}
                onClick={() => setDays(d => d.includes(idx) ? d.filter(x => x !== idx) : [...d, idx])}>
                {lab}
              </button>
            ))}
          </div>
          {days.length === 0 && <span className="text-xs text-mut">No repeat — one-time alarm</span>}
          <div className="ml-auto flex gap-2">
            {editingId && <button className="btn" onClick={resetForm}>Cancel</button>}
            <button className="btn btn-primary" onClick={submit}>{editingId ? "Save changes" : "Add alarm"}</button>
          </div>
        </div>
        <p className="text-[11px] text-mut mt-3">The time field follows your device locale; the displayed time follows your 12/24-hour setting.</p>
      </div>

      {/* list */}
      <div className="mt-5 space-y-3">
        {alarms.length === 0 ? (
          <div className="panel p-10 text-center">
            <div className="text-mut flex justify-center mb-3"><Icon name="alarm" size={26} /></div>
            <p className="text-sm font-medium">No alarms yet</p>
            <p className="text-xs text-mut mt-1">Set a time above — one-time or repeating on the weekdays you choose.</p>
          </div>
        ) : alarms.map(a => {
          const occ = a.enabled ? (a.snoozeAt && a.snoozeAt > now.getTime() ? new Date(a.snoozeAt) : nextAlarmOccurrence(a, now)) : null;
          return (
            <div key={a.id} className="panel p-4 flex items-center gap-4">
              <Switch checked={a.enabled} onChange={() => aapi.toggle(a.id)} label={"Toggle alarm " + a.name} />
              <div className="min-w-0 flex-1">
                <div className="font-medium text-sm truncate">{a.name}</div>
                <div className="text-xs text-mut mt-0.5">{repeatLabel(a.days)} · {a.tone} tone{!a.enabled && " · off"}</div>
              </div>
              <div className="text-right shrink-0">
                <div className={"num text-2xl font-semibold" + (a.enabled ? "" : " text-mut line-through opacity-70")}>
                  {fmtStoredTime(a.time, settings.timeFormat === "12")}
                </div>
                {a.enabled && occ && <div className="text-[11px] text-mut num mt-0.5">in {fmtSpan(occ.getTime() - now.getTime())}</div>}
              </div>
              <div className="flex gap-1 shrink-0">
                <button className="icon-btn" style={{ width: 32, height: 32 }} aria-label={"Edit " + a.name} onClick={() => startEdit(a)}>
                  <Icon name="pencil" size={14} />
                </button>
                {confirmId === a.id ? (
                  <button className="icon-btn danger" style={{ width: 32, height: 32 }} aria-label="Confirm delete"
                    onClick={() => { aapi.remove(a.id); setConfirmId(null); push("Alarm deleted"); }}>
                    <Icon name="check" size={14} />
                  </button>
                ) : (
                  <button className="icon-btn" style={{ width: 32, height: 32 }} aria-label={"Delete " + a.name}
                    onClick={() => { setConfirmId(a.id); setTimeout(() => setConfirmId(c => c === a.id ? null : c), 2500); }}>
                    <Icon name="trash" size={14} />
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div className="panel p-4 mt-6 flex gap-3 items-start">
        <span className="text-acc mt-0.5"><Icon name="info" size={16} /></span>
        <p className="text-xs text-mut leading-relaxed">
          Alarms work while this tab is open — including in a background tab. If you close the browser entirely,
          or your device sleeps, the alarm may be delayed or silent. For critical wake-ups, keep DarkClock Pro
          open in a tab and leave your display awake.
        </p>
      </div>
    </div>
  );
}

/* ================================================================
   WORLD CLOCK PAGE
   ================================================================ */
function WorldPage() {
  const { settings, push } = useCtx();
  const [list, setList] = usePersisted("world", ["America/New_York", "Europe/London", "Asia/Tokyo"]);
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const now = useNow(1000);
  const hour12 = settings.timeFormat === "12";

  const results = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    return CITIES.filter(c => (c[0] + " " + c[1] + " " + c[2]).toLowerCase().includes(s)).slice(0, 8);
  }, [q]);

  const add = (tz) => {
    if (list.includes(tz)) { push("That clock is already on your list", "info"); setQ(""); setOpen(false); return; }
    setList(l => [...l, tz]); setQ(""); setOpen(false); push("World clock added", "globe");
  };
  const localOff = -now.getTimezoneOffset();

  return (
    <div>
      <PageHead icon="globe" title="WORLD CLOCK"
        desc={["Current time in cities around the world",
          "Add any city to see its live time, date and difference from your local clock. Daylight saving is handled automatically for every zone."]} />

      <div className="relative max-w-md">
        <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mut pointer-events-none"><Icon name="search" size={16} /></span>
        <input className="inp pl-10" placeholder="Search a city or time zone…" value={q} aria-label="Search cities"
          onChange={e => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onKeyDown={e => { if (e.key === "Escape") setOpen(false); }} />
        {open && results.length > 0 && (
          <div className="absolute left-0 right-0 top-full mt-2 panel overflow-hidden z-20" style={{ boxShadow: "var(--shadow)" }} role="listbox">
            {results.map(c => (
              <button key={c[2] + c[0]} role="option" aria-selected="false" className="w-full text-left px-4 py-3 flex items-center justify-between gap-3 hover:bg-card2 transition-colors"
                onMouseDown={() => add(c[2])}>
                <span className="text-sm">{c[0]}<span className="text-mut text-xs ml-2">{c[1]}</span></span>
                <span className="num text-xs text-mut">{fmtOffset(tzOffsetMin(c[2], now))}</span>
              </button>
            ))}
          </div>
        )}
      </div>
      <p className="text-xs text-mut mt-3">Your time zone: {Intl.DateTimeFormat().resolvedOptions().timeZone || "local"} · {fmtOffset(localOff)}</p>

      {list.length === 0 ? (
        <div className="panel p-10 mt-6 text-center">
          <div className="text-mut flex justify-center mb-3"><Icon name="globe" size={26} /></div>
          <p className="text-sm font-medium">No world clocks yet</p>
          <p className="text-xs text-mut mt-1 mb-4">Search above, or start with a few favorites:</p>
          <div className="flex flex-wrap justify-center gap-2">
            {[["New York", "America/New_York"], ["London", "Europe/London"], ["Tokyo", "Asia/Tokyo"], ["Sydney", "Australia/Sydney"]].map(([c, tz]) => (
              <button key={tz} className="chip" onClick={() => add(tz)}>{c}</button>
            ))}
          </div>
        </div>
      ) : (
        <div className="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {list.map(tz => {
            const city = CITIES.find(c => c[2] === tz);
            const p = getTimeParts(tz, now, hour12);
            const off = tzOffsetMin(tz, now);
            const shift = dayShift(tz, now);
            return (
              <div key={tz} className="panel p-5 group relative">
                <button className="icon-btn absolute top-3 right-3 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity"
                  style={{ width: 30, height: 30 }} aria-label={"Remove " + (city ? city[0] : tz)}
                  onClick={() => { setList(l => l.filter(x => x !== tz)); push("Clock removed"); }}>
                  <Icon name="x" size={14} />
                </button>
                <div className="font-medium text-sm">{city ? city[0] : tz.split("/").pop().replace(/_/g, " ")}</div>
                <div className="text-xs text-mut">{city ? city[1] : "Time zone"}</div>
                <div className="num mt-4 flex items-baseline gap-2">
                  <span className="text-3xl font-semibold leading-none">{p.h}:{p.m}</span>
                  <span className="text-acc text-sm font-medium">{p.s}</span>
                  {p.ap && <span className="text-xs text-mut font-medium">{p.ap}</span>}
                </div>
                <div className="text-xs text-mut mt-1.5">{getShortDate(tz, now)}</div>
                <div className="flex flex-wrap gap-1.5 mt-4">
                  <span className="chip" style={{ cursor: "default" }}>{fmtOffset(off)}</span>
                  <span className="chip" style={{ cursor: "default" }}>{fmtDiff(off - localOff)}</span>
                  {shift && <span className="chip chip-on" style={{ cursor: "default" }}>{shift}</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   SETTINGS PAGE
   ================================================================ */
function SettingsPage() {
  const { settings, update, setSettings, push } = useCtx();
  const [confirm, setConfirm] = useState(false);
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const permText = { granted: "Allowed", denied: "Blocked by browser", default: "Not requested yet", unsupported: "Not supported in this browser" }[perm];

  return (
    <div className="max-w-3xl">
      <PageHead icon="settings" title="SETTINGS"
        desc={["Make DarkClock Pro yours",
          "Theme, format, sound and clock preferences — saved on this device only, never sent anywhere."]} />

      <section className="panel p-6 mb-5">
        <h2 className="text-sm font-semibold mb-1">Appearance & time</h2>
        <Row label="Theme" hint="Dark is the default; light mode is here if you need it">
          <Seg value={settings.theme} onChange={v => update({ theme: v })} ariaLabel="Theme"
            options={[{ value: "dark", label: "Dark", icon: "moon" }, { value: "light", label: "Light", icon: "sun" }]} />
        </Row>
        <Row label="Time format">
          <Seg value={settings.timeFormat} onChange={v => update({ timeFormat: v })} ariaLabel="Time format"
            options={[{ value: "12", label: "12-hour" }, { value: "24", label: "24-hour" }]} />
        </Row>
        <Row label="Clock style" hint="Used on the Clock page and in fullscreen">
          <Seg value={settings.clockStyle} onChange={v => update({ clockStyle: v })} ariaLabel="Clock style"
            options={[{ value: "digital", label: "Digital" }, { value: "minimal", label: "Minimal" }, { value: "flip", label: "Flip" }]} />
        </Row>
        <Row label="Show seconds on the clock">
          <Switch checked={settings.showSeconds} onChange={v => update({ showSeconds: v })} label="Show seconds" />
        </Row>
        <Row label="Show the date">
          <Switch checked={settings.showDate} onChange={v => update({ showDate: v })} label="Show date" />
        </Row>
        <Row label="Display time zone" hint="‘Device time (auto)’ follows wherever you are">
          <TzSelect value={settings.displayTz} onChange={v => update({ displayTz: v })} />
        </Row>
      </section>

      <section className="panel p-6 mb-5">
        <h2 className="text-sm font-semibold mb-1">Sound & notifications</h2>
        <Row label="Sound" hint="Timer and alarm tones — generated locally, no files downloaded">
          <div className="flex items-center gap-3">
            <button className="icon-btn" aria-label="Preview tone" onClick={() => AudioEngine.tone("chime")}><Icon name="volume" size={16} /></button>
            <Switch checked={settings.sound} onChange={v => update({ sound: v })} label="Sound" />
          </div>
        </Row>
        <Row label="Browser notifications" hint={"Permission status: " + permText}>
          <div className="flex items-center gap-3">
            {perm === "default" && (
              <button className="btn text-xs" onClick={() => requestNotify().then(p => {
                if (p === "granted") push("Notifications enabled");
                else if (p === "denied") push("Blocked — change it in your browser's site settings", "info");
              })}>Allow</button>
            )}
            <Switch checked={settings.notify} onChange={v => {
              update({ notify: v });
              if (v && perm === "default") requestNotify().then(p => { if (p === "granted") push("Notifications enabled"); });
            }} label="Browser notifications" />
          </div>
        </Row>
        {perm === "denied" && (
          <p className="text-xs text-mut mt-2">Notifications are blocked for this site. Re-enable them in your browser's site settings if you want desktop alerts.</p>
        )}
        <Row label="Default timer duration" hint="Pre-filled when you create a new timer">
          <select className="sel" value={settings.defaultTimerMin} onChange={e => update({ defaultTimerMin: +e.target.value })} aria-label="Default timer duration">
            {PRESETS.map(m => <option key={m} value={m}>{m} minutes</option>)}
          </select>
        </Row>
      </section>

      <section className="panel p-6 mb-5">
        <h2 className="text-sm font-semibold mb-4 flex items-center gap-2"><Icon name="keyboard" size={16} /> Keyboard shortcuts</h2>
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-[10px] uppercase tracking-[.14em] text-mut border-b border-line">
              <th scope="col" className="pb-2 font-medium">Key</th>
              <th scope="col" className="pb-2 font-medium">Where</th>
              <th scope="col" className="pb-2 font-medium">Action</th>
            </tr>
          </thead>
          <tbody>
            {SHORTCUTS.map(([k, w, a]) => (
              <tr key={k + w} className="border-b border-line last:border-0">
                <td className="py-2.5"><kbd className="kbd">{k}</kbd></td>
                <td className="py-2.5 text-mut">{w}</td>
                <td className="py-2.5">{a}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>

      <section className="panel p-6">
        <h2 className="text-sm font-semibold mb-1">Reset</h2>
        <p className="text-xs text-mut mb-4">Restores theme, format, sound and clock preferences to their defaults. Your timers and alarms are kept.</p>
        <button className={"btn" + (confirm ? " btn-danger" : "")}
          onClick={() => {
            if (!confirm) { setConfirm(true); setTimeout(() => setConfirm(false), 3000); }
            else { setSettings({ ...DEFAULT_SETTINGS }); setConfirm(false); push("Settings restored to defaults", "reset"); }
          }}>
          <Icon name="reset" size={14} /> {confirm ? "Click again to confirm" : "Reset settings"}
        </button>
      </section>
    </div>
  );
}

/* ================================================================
   STATIC PAGES
   ================================================================ */
function StaticPage({ kicker, title, children }) {
  return (
    <article className="max-w-2xl mx-auto">
      <PageHead icon="file" title={kicker} desc={[title, ""]} />
      <div className="space-y-5 text-sm leading-relaxed text-mut pb-4 [&_h2]:text-ink [&_h2]:text-base [&_h2]:font-semibold [&_h2]:mt-8 [&_a]:text-acc [&_a]:hover:underline">{children}</div>
    </article>
  );
}
function AboutPage() {
  return (
    <StaticPage kicker="ABOUT" title="Time tools that respect your attention">
      <p>
        DarkClock Pro started with a simple observation: most online clocks bury a useful tool under pop-ups,
        fake buttons and auto-playing video. This is the opposite of that — a quiet, black, precise set of time
        tools that loads instantly and stays out of your way.
      </p>
      <h2>What's inside</h2>
      <ul className="space-y-2 list-none">
        {[
          ["clock", "A large online clock with digital, minimal and flip styles, plus a fullscreen study mode"],
          ["timer", "A free online timer with presets, progress ring, sound and desktop notifications"],
          ["stopwatch", "A millisecond stopwatch with lap splits and fastest/slowest highlighting"],
          ["alarm", "An online alarm clock with weekday repeat, custom tones and snooze"],
          ["globe", "A world clock for any city, with automatic daylight-saving handling"],
        ].map(([ic, t]) => (
          <li key={t} className="flex gap-3 items-start"><span className="text-acc mt-0.5"><Icon name={ic} size={16} /></span>{t}</li>
        ))}
      </ul>
      <h2>Private by design</h2>
      <p>
        There is no account, no server and no tracking of what you time. Every calculation — the clock, the
        countdown, the laps — happens in your browser. Your settings, alarms and world clocks live in your own
        browser storage and never leave your device.
      </p>
      <h2>For study, focus and the desk</h2>
      <p>
        The fullscreen clock was built for study sessions and desk setups: enormous tabular numerals, a
        seconds ruler you can read across the room, and keyboard shortcuts for everything that matters.
      </p>
    </StaticPage>
  );
}
function ContactPage() {
  const [sent, setSent] = useState(false);
  const onSubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const subject = encodeURIComponent("DarkClock Pro — " + (fd.get("topic") || "Hello"));
    const body = encodeURIComponent("From: " + fd.get("name") + " <" + fd.get("email") + ">\n\n" + fd.get("message"));
    window.location.href = "mailto:" + SITE_CONFIG.contactEmail + "?subject=" + subject + "&body=" + body;
    setSent(true);
  };
  return (
    <StaticPage kicker="CONTACT" title="Say hello">
      <p>
        Found a bug, have an idea, or just want to say the flip clock made your day? Send a message — it opens
        your own email app, so nothing is submitted to a server here.
      </p>
      <form className="space-y-4" onSubmit={onSubmit}>
        <div className="grid sm:grid-cols-2 gap-4">
          <label className="block">
            <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Your name</span>
            <input name="name" required className="inp" autoComplete="name" />
          </label>
          <label className="block">
            <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Your email</span>
            <input name="email" type="email" required className="inp" autoComplete="email" />
          </label>
        </div>
        <label className="block">
          <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Topic</span>
          <select name="topic" className="sel w-full">
            <option>Feedback</option><option>Bug report</option><option>Feature idea</option><option>Business</option>
          </select>
        </label>
        <label className="block">
          <span className="block text-[10px] uppercase tracking-[.14em] text-mut mb-1.5">Message</span>
          <textarea name="message" required rows="5" className="inp" style={{ resize: "vertical" }} />
        </label>
        <button type="submit" className="btn btn-primary"><Icon name="mail" size={15} /> Compose email</button>
        {sent && <p className="text-xs text-mut">Your email app should have opened. If not, write to {SITE_CONFIG.contactEmail} directly.</p>}
      </form>
    </StaticPage>
  );
}
function PrivacyPage() {
  return (
    <StaticPage kicker="PRIVACY POLICY" title="Your data stays with you">
      <p>Last updated: {new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</p>
      <h2>The short version</h2>
      <p>
        DarkClock Pro runs entirely in your browser. We do not operate user accounts, we do not receive your
        timers, alarms, laps or settings, and we do not sell anything about you — there is simply no server on
        the other end collecting it.
      </p>
      <h2>What is stored on your device</h2>
      <p>
        Your preferences (theme, time format, clock style), your timers, alarms and world-clock selection are
        saved in your browser's localStorage under the <code className="text-ink">dcp.*</code> keys. This is what
        makes your alarms survive a page refresh. You can erase it at any time via "Reset settings" or by
        clearing site data in your browser.
      </p>
      <h2>Notifications</h2>

        rings. Permission is requested only when you choose to enable it, and you can revoke it in your browser
        at any time.
      </p>
      <h2>No advertising</h2>
      <p>
        This site displays no advertisements, uses no advertising networks, and sets no tracking or marketing
        cookies.
      </p>
      <h2>Changes</h2>
      <p>If this policy changes, the updated date above will change with it.</p>
    </StaticPage>
  );
}
function TermsPage() {
  return (
    <StaticPage kicker="TERMS & CONDITIONS" title="The fine print, kept short">
      <p>Last updated: {new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</p>

/* ================================================================
   OVERLAYS: alarm ringing + finished timer
   ================================================================ */
function AlarmRinging({ alarm, onDismiss, onSnooze }) {
  const { settings } = useCtx();
  const now = useNow(1000);
  const p = getTimeParts(settings.displayTz, now, settings.timeFormat === "12");
  useEffect(() => {
    document.body.classList.add("locked");
    return () => document.body.classList.remove("locked");
  }, []);
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-6"
      style={{ background: "rgba(5,5,5,.9)", backdropFilter: "blur(10px)" }}
      role="alertdialog" aria-modal="true" aria-label="Alarm ringing">
      <div className="text-center panel px-8 sm:px-16 py-12" style={{ boxShadow: "var(--shadow)" }}>
        <p className="overline" style={{ color: "var(--acc)" }}>Alarm</p>
        <p className="mt-4 text-xl font-medium">{alarm.name || "Alarm"}</p>
        <p className="num mt-4 text-[clamp(3rem,10vw,6rem)] leading-none font-semibold">
          {fmtStoredTime(alarm.time, settings.timeFormat === "12")}
        </p>
        <p className="mt-4 text-sm text-mut num">
          Now {p.h}:{p.m}:{p.s}{p.ap && " " + p.ap} · {repeatLabel(alarm.days)}
        </p>
        <div className="mt-9 flex flex-col sm:flex-row gap-3 justify-center">
          <button className="btn" onClick={onSnooze}><Icon name="alarm" size={15} /> Snooze 5 min</button>
          <button className="btn btn-primary alarm-stop" onClick={onDismiss}><Icon name="x" size={15} /> Stop</button>
        </div>
      </div>
    </div>
  );
}
function TimerDoneBanner({ timer, onStop, onRestart }) {
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[65] panel px-5 py-4 flex items-center gap-4 max-w-[calc(100vw-32px)]"
      style={{ boxShadow: "var(--shadow)", animation: "rise .35s ease both" }} role="status">
      <span className="text-acc"><Icon name="alarm" size={20} /></span>
      <div className="min-w-0">
        <div className="text-sm font-medium">Timer finished</div>
        <div className="text-xs text-mut truncate">{timer.name || "Timer"} · {fmtDur(timer.durationMs)}</div>
      </div>
      <div className="flex gap-2 shrink-0">
        <button className="btn" onClick={onStop}>Stop</button>
        <button className="btn btn-primary" onClick={onRestart}>Restart</button>
      </div>
    </div>
  );
}

/* ================================================================
   APP SHELL
   ================================================================ */
function App() {
  const [settings, setSettings] = usePersisted("settings", DEFAULT_SETTINGS);
  const [timers, setTimers] = usePersisted("timers", [], true);
  const [alarms, setAlarms] = usePersisted("alarms", []);
  const [ringingAlarm, setRingingAlarm] = useState(null);
  const [fs, setFs] = useState(false);
  const [toasts, setToasts] = useState([]);
  const route = useRoute();

  const update = (patch) => setSettings(s => ({ ...s, ...patch }));
  const push = (msg, icon) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t.slice(-3), { id, msg, icon }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2800);
  };
  const notify = (title, body) => { if (settings.notify) sendNotify(title, body); };

  useEffect(() => { document.documentElement.dataset.theme = settings.theme; }, [settings.theme]);

  // ---- per-route SEO title / description ----
  useEffect(() => {
    const m = META[route] || META["/"];
    document.title = m[0];
    const d = document.querySelector('meta[name="description"]');
    if (d && m[1]) d.setAttribute("content", m[1]);
    window.scrollTo({ top: 0 });
  }, [route]);

  /* ================= TIMER ENGINE (timestamp-based, drift-free) ================= */
  const endRefs = useRef({});
  const clearEnd = (id) => { if (endRefs.current[id]) { clearTimeout(endRefs.current[id]); delete endRefs.current[id]; } };
  const patchT = (id, fn) => setTimers(ts => ts.map(t => t.id === id ? fn(t) : t));

  const tapi = useMemo(() => ({
    add(name, durationMs) {
      let out = null;
      setTimers(ts => {
        if (ts.length >= 8) return ts;
        const id = "t" + Date.now() + Math.random().toString(36).slice(2, 6);
        out = id;
        return [...ts, { id, name: name || "Timer", durationMs, remainingMs: durationMs, running: false, completed: false, notified: false, silenced: false }];
      });
      if (out === null) push("Timer limit reached (8)", "info");
      return out;
    },
    remove(id) { clearEnd(id); setTimers(ts => ts.filter(t => t.id !== id)); },
    rename(id, name) { patchT(id, t => ({ ...t, name })); },
    start(id) {
      AudioEngine.ensure();
      setTimers(ts => ts.map(t => {
        if (t.id !== id) return t;
        clearEnd(id);
        const rem = t.remainingMs > 0 ? t.remainingMs : t.durationMs;
        if (rem <= 0) return t;
        const endAt = Date.now() + rem;
        endRefs.current[id] = setTimeout(() => {
          setTimers(x => x.map(y => y.id === id ? { ...y, running: false, remainingMs: 0, completed: true, notified: false } : y));
        }, rem + 40);
        return { ...t, running: true, endAt, remainingMs: rem, completed: false, notified: false, silenced: false };
      }));
    },
    pause(id) {
      clearEnd(id);
      setTimers(ts => ts.map(t => t.id === id && t.running
        ? { ...t, running: false, remainingMs: Math.max(0, t.endAt - Date.now()) } : t));
    },
    reset(id) {
      clearEnd(id);
      patchT(id, t => ({ ...t, running: false, remainingMs: t.durationMs, completed: false, notified: false, silenced: false }));
    },
    silence(id) { patchT(id, t => ({ ...t, silenced: true })); },
  }), []);

  // tick loop for running timers (display) + snap on tab return
  const anyRunning = timers.some(t => t.running);
  useEffect(() => {
    if (!anyRunning) return;
    const id = setInterval(() => {
      setTimers(ts => ts.map(t => {
        if (!t.running) return t;
        const rem = t.endAt - Date.now();
        return rem <= 0 ? { ...t, running: false, remainingMs: 0, completed: true, notified: false } : { ...t, remainingMs: rem };
      }));
    }, 250);
    const onVis = () => setTimers(ts => ts.map(t => t.running ? { ...t, remainingMs: Math.max(0, t.endAt - Date.now()) } : t));
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, [anyRunning]);

  // catch timers that finished while the page was closed
  useEffect(() => {
    setTimers(ts => ts.some(t => t.running && t.endAt && t.endAt <= Date.now())
      ? ts.map(t => t.running && t.endAt <= Date.now() ? { ...t, running: false, remainingMs: 0, completed: true, notified: true } : t)
      : ts);
  }, []);

  // one-time desktop notification per completion
  useEffect(() => {
    for (const t of timers) {
      if (t.completed && !t.notified) {
        notify("Timer finished", (t.name || "Timer") + " · countdown complete");
        patchT(t.id, x => ({ ...x, notified: true }));
      }
    }
  }, [timers]);

  /* ================= ALARM ENGINE ================= */
  const alarmsRef = useRef(alarms);
  useEffect(() => { alarmsRef.current = alarms; }, [alarms]);
  const ringRef = useRef(null);
  ringRef.current = ringingAlarm;

  const aapi = useMemo(() => ({
    add(a) { setAlarms(ts => [...ts, { ...a, id: "a" + Date.now(), enabled: true }]); },
    update(id, patch) { setAlarms(ts => ts.map(a => a.id === id ? { ...a, ...patch } : a)); },
    remove(id) { setAlarms(ts => ts.filter(a => a.id !== id)); },
    toggle(id) { setAlarms(ts => ts.map(a => a.id === id ? { ...a, enabled: !a.enabled } : a)); },
  }), []);

  const checkAlarms = () => {
    if (ringRef.current) return;
    const now = new Date();
    for (const a of alarmsRef.current) {
      if (!a.enabled) continue;
      let fire = false, key = null;
      if (a.snoozeAt) {
        if (now.getTime() >= a.snoozeAt) { fire = true; key = "snooze-" + a.snoozeAt; }
      } else {
        const hh = +a.time.slice(0, 2), mm = +a.time.slice(3, 5);
        key = now.toDateString() + " " + pad(hh) + ":" + pad(mm);
        if (hh === now.getHours() && mm === now.getMinutes() && a.lastFired !== key
          && (!a.days || !a.days.length || a.days.includes(now.getDay()))) fire = true;
      }
      if (fire) {
        setAlarms(ts => ts.map(x => x.id === a.id ? { ...x, lastFired: key, snoozeAt: null } : x));
        setRingingAlarm({ ...a });
        notify("Alarm — " + (a.name || "Alarm"), "It's " + fmtStoredTime(a.time, settings.timeFormat === "12"));
        break;
      }
    }
  };
  useEffect(() => {
    const id = setInterval(checkAlarms, 1000);
    const onVis = () => checkAlarms();
    document.addEventListener("visibilitychange", onVis);
    checkAlarms();
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  // guaranteed wake-up even when background tabs are heavily throttled
  useEffect(() => {
    let tm;
    const schedule = () => {
      if (tm) clearTimeout(tm);
      const nowMs = Date.now();
      let best = Infinity;
      for (const a of alarmsRef.current) {
        if (!a.enabled) continue;
        if (a.snoozeAt && a.snoozeAt >= nowMs) best = Math.min(best, a.snoozeAt);
        const occ = nextAlarmOccurrence(a, new Date(nowMs));
        if (occ) best = Math.min(best, occ.getTime());
      }
      if (best < Infinity) tm = setTimeout(() => { checkAlarms(); schedule(); }, Math.max(0, best - nowMs) + 80);
    };
    schedule();
    return () => tm && clearTimeout(tm);
  }, [alarms]);

  /* ================= RINGING SOUND LOOP ================= */
  const ringingTimer = timers.find(t => t.completed && !t.silenced);
  const ringing = !!ringingAlarm || !!ringingTimer;
  useEffect(() => {
    if (!ringing || !settings.sound) return;
    const play = () => ringingAlarm ? AudioEngine.tone(ringingAlarm.tone || "chime") : AudioEngine.tone("digital");
    play();
    const id = setInterval(play, 1900);
    return () => clearInterval(id);
  }, [ringing, settings.sound, ringingAlarm && ringingAlarm.id, ringingTimer && ringingTimer.id]);

  const ctxValue = {
    settings, update, setSettings, push, notify,
    timers, tapi, alarms, aapi, openFS: () => setFs(true),
  };

  let page;
  if (route === "/clock") page = <ClockPage openFS={() => setFs(true)} />;
  else if (route === "/timer") page = <TimerPage />;
  else if (route === "/stopwatch") page = <StopwatchPage />;
  else if (route === "/alarm") page = <AlarmPage />;
  else if (route === "/world") page = <WorldPage />;
  else if (route === "/settings") page = <SettingsPage />;
  else if (route === "/about") page = <AboutPage />;
  else if (route === "/contact") page = <ContactPage />;
  else if (route === "/privacy") page = <PrivacyPage />;
  else if (route === "/terms") page = <TermsPage />;
  else page = <Home openFS={() => setFs(true)} />;

  return (
    <Ctx.Provider value={ctxValue}>
      <div className="min-h-screen flex flex-col">
        <Nav route={route} />
        <main className="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6">{page}</main>
        <Footer />
      </div>

      {fs && <FullscreenClock onClose={() => setFs(false)} />}
      {ringingAlarm && (
        <AlarmRinging alarm={ringingAlarm}
          onSnooze={() => {
            const a = ringingAlarm; setRingingAlarm(null);
            setAlarms(ts => ts.map(x => x.id === a.id ? { ...x, snoozeAt: Date.now() + 5 * 60000 } : x));
            push("Snoozed for 5 minutes", "alarm");
          }}
          onDismiss={() => setRingingAlarm(null)} />
      )}
      {ringingTimer && (
        <TimerDoneBanner timer={ringingTimer}
          onStop={() => tapi.silence(ringingTimer.id)}
          onRestart={() => { tapi.reset(ringingTimer.id); tapi.start(ringingTimer.id); }} />
      )}
      <Toasts items={toasts} />
    </Ctx.Provider>
  );
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  render() {
    if (this.state.err) {
      return (
        <div className="min-h-screen flex items-center justify-center p-6" style={{ background: "var(--bg)" }}>
          <div className="panel p-8 max-w-md text-center">
            <h1 className="text-lg font-semibold mb-2">Something went wrong</h1>
            <p className="text-sm text-mut mb-5">The app hit an unexpected error. Your saved settings are safe.</p>
            <button className="btn btn-primary" onClick={() => location.reload()}>Reload DarkClock Pro</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App /></Boundary>);
</script>
</body>
